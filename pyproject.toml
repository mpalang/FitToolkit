[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fittoolkit"
version = "0.1"
description = "My personal Python toolkit for scientific fitting and optimization."
readme = "README.md"
requires-python = ">=3.14.4"
license = {text = "Proprietary"}

authors = [
    {name = "Moritz Lang"}
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "lmfit>=1.3",
    "matplotlib>=3.11.0",
    "iminuit>=2.31.3",
]